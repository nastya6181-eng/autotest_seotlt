# Какая страница сайта какому макету соответствует. Адреса — путями, без домена.
# Макет: Figma → фрейм → Export SVG (Outline text выключен, 1x), затем
#   python checks/design/design_compare.py extract <файл>.svg sites/innotech/design/<имя>.json
# Сам SVG в репозиторий не кладём (десятки МБ векторного фона), только извлечённый JSON.
#
# dynamic — зоны макета, где контент меняется (новости, слайдеры, календарь): тексты оттуда
# не сравниваются. Координаты макета в px: [y1, y2] — на всю ширину, [x1, y1, x2, y2] — прямоугольник.
#
# tolerance — допуск по положению в px (левый край, отступы): сдвиги в его пределах — норма.
# Без него — 2 px. Разово перекрывается переменной DESIGN_TOLERANCE_PX / полем при ручном запуске.
- name: main
  page: /
  width: 1600
  design: main-1600.json
  source: src/main-1600.svg
  tolerance: 2
  dynamic:
    - [880, 1320]               # новости: карточки меняются каждый день
    - [200, 6060, 560, 6620]    # «Нам доверяют»: описания резидентов в слайдере, левая колонка
    - [1040, 6060, 1440, 6620]  #   …правая колонка
    - [580, 6840, 1600, 7700]   # «Истории успеха»: карусель историй
    - [150, 7280, 580, 7700]    #   …второй ряд
    - [140, 8390, 1600, 8900]   # календарь мероприятий
