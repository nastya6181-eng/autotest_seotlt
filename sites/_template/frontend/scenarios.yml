# Фронт: что проверять в браузере на этом сайте. Формат — checks/frontend/README.md.
# Адрес сайта — из секрета SITE_<КЛЮЧ>, здесь только пути. Слой пока в разработке: файл — описание.

widths: [375, 768, 1280]          # ширины для проверки адаптива и ошибок JS

pages:                            # страницы: ошибки JS + адаптив на всех ширинах
  - /
  - /contacts/

scenarios:                        # действия посетителя и что должно получиться
  - name: menu-mobile             # латиница, цифры, «-»
    page: /
    width: 375
    steps:
      - click: "кнопка меню"      # текст, aria-label или CSS-селектор
      - expect_visible: "Контакты"

forms:                            # формы: проверка интерфейса, БЕЗ отправки
  - name: feedback
    page: /contacts/
    required: ["Имя", "Телефон"]  # поля, без которых форма не отправляется
