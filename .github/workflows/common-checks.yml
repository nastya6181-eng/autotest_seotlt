# Общие проверки сайтов — только ручной запуск: сайты от изменений в репозитории
# не меняются, обходить их на каждый PR или мерж бессмысленно. Код проверяет selftest.yml.
# Один пайплайн, три этапа:
#   infra  — самопроверка, зависимости, словари, список сайтов
#   tests  — чанк на каждый сайт: обход сайта, затем тесты по одному шагу на проверку
#   logs   — сборщик: логи и отчёты всех чанков, сводка, Checks, история
name: Common checks
run-name: "Common checks · ${{ inputs.site || 'all' }}"

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Ключ сайта (секрет SITE_<КЛЮЧ>), любой адрес https://… или all"
        default: all
      max_pages:
        description: "Страниц на сайт (пусто — из project.yml или 200)"
        default: ""
      checks:
        description: "Только эти тесты: tech,seo,links,spelling,typography (пусто — все)"
        default: ""

permissions:
  contents: read

concurrency:
  group: common-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Явный bash включает pipefail: без него «python … | tee лог» отдаёт код tee (0),
# и упавший тест оставлял шаг, задание и весь прогон зелёными.
defaults:
  run:
    shell: bash

env:
  # true — полные адреса страниц в логах, сводке и Checks (для приватного репозитория).
  # Иначе там пути (/about/), а кликабельные ссылки — в report.html из артефакта.
  REPORT_FULL_URLS: ${{ vars.REPORT_FULL_URLS || 'false' }}
  PYTHON_VERSION: "3.12"
  DICT_CACHE_KEY: hunspell-ru-en-v1
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # ───────────────────────────── этап 1: инфраструктура ─────────────────────────────
  infra:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Самопроверка правил
        run: python -m unittest discover -v tests

      - name: Кэш словарей Hunspell
        id: dict
        uses: actions/cache@v4
        with:
          path: checks/content/.cache/dict
          key: ${{ env.DICT_CACHE_KEY }}

      - name: Словари Hunspell
        if: steps.dict.outputs.cache-hit != 'true'
        run: python -c "import sys; sys.path.insert(0, '.'); from checks.content.spelling import ensure_dicts; ensure_dicts('checks/content/.cache/dict')"

      - name: Список сайтов
        id: sites
        env:
          # Секреты репозитория SITE_<КЛЮЧ> (Settings → Secrets and variables → Actions → Secrets),
          # по одному на сайт: «https://адрес [опция=значение ...]». Из toJSON(secrets) скрипт берёт
          # только SITE_*, в матрицу уходят ключи и имена секретов. SITES — запасной общий список.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          SITES: ${{ secrets.SITES }}
          SITE: ${{ inputs.site || 'all' }}
        run: |
          python checks/core/list_sites.py --mask
          sites=$(python checks/core/list_sites.py)
          [ "$sites" != "[]" ] || { echo "::error::Нет сайтов: заведи секреты SITE_<КЛЮЧ>"; exit 1; }
          echo "$sites" | jq -r '"Сайтов: \(length) — " + (map(.key) | join(", "))'
          echo "sites=$sites" >> "$GITHUB_OUTPUT"

  # ─────────────────────── этап 2: тесты, по чанку на сайт ───────────────────────
  tests:
    needs: infra
    name: tests (${{ matrix.site.key }})
    # Сайты могут не открываться с зарубежных IP GitHub. Тогда заведи свой раннер
    # в РФ и укажи его метку в переменной репозитория RUNNER.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        site: ${{ fromJson(needs.infra.outputs.sites) }}
    env:
      # Чанк получает только секрет своего сайта, по имени из матрицы
      SITES: ${{ matrix.site.secret && format('{0}={1}', matrix.site.key, secrets[matrix.site.secret]) || secrets.SITES }}
      SITE: ${{ matrix.site.url || matrix.site.key }}
      MAX_PAGES: ${{ inputs.max_pages }}
      CHECKS: ${{ inputs.checks }}
      OUT: reports/${{ matrix.site.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Спрятать адреса сайтов в логах
        run: python checks/core/list_sites.py --mask

      - name: Словари из кэша
        uses: actions/cache/restore@v4
        with:
          path: checks/content/.cache/dict
          key: ${{ env.DICT_CACHE_KEY }}

      - name: Обход сайта
        id: crawl
        run: |
          mkdir -p "$OUT/logs"
          python checks/content/run_checks.py --stage crawl 2>&1 | tee "$OUT/logs/crawl.log"

      - name: "Тест: техника"
        if: always() && steps.crawl.outcome == 'success' && (env.CHECKS == '' || contains(env.CHECKS, 'tech'))
        run: python checks/content/run_checks.py --stage test --only tech 2>&1 | tee "$OUT/logs/tech.log"

      - name: "Тест: SEO"
        if: always() && steps.crawl.outcome == 'success' && (env.CHECKS == '' || contains(env.CHECKS, 'seo'))
        run: python checks/content/run_checks.py --stage test --only seo 2>&1 | tee "$OUT/logs/seo.log"

      - name: "Тест: ссылки"
        if: always() && steps.crawl.outcome == 'success' && (env.CHECKS == '' || contains(env.CHECKS, 'links'))
        run: python checks/content/run_checks.py --stage test --only links 2>&1 | tee "$OUT/logs/links.log"

      - name: "Тест: орфография"
        if: always() && steps.crawl.outcome == 'success' && (env.CHECKS == '' || contains(env.CHECKS, 'spelling'))
        run: python checks/content/run_checks.py --stage test --only spelling 2>&1 | tee "$OUT/logs/spelling.log"

      - name: "Тест: типографика"
        if: always() && steps.crawl.outcome == 'success' && (env.CHECKS == '' || contains(env.CHECKS, 'typography'))
        run: python checks/content/run_checks.py --stage test --only typography 2>&1 | tee "$OUT/logs/typography.log"

      - name: Отчёт по сайту
        if: always() && steps.crawl.outcome != 'skipped'
        run: python checks/content/run_checks.py --stage report 2>&1 | tee "$OUT/logs/report.log" || true

      - name: Результаты чанка
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.site.key }}
          path: ${{ env.OUT }}
          retention-days: 90

      - name: Сводка на странице прогона
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            cat "$OUT/summary.md" 2>/dev/null || echo "### ❌ ${{ matrix.site.key }}: отчёта нет — см. шаги «Обход сайта» и «Тест: …»"
            echo
            echo "Лог каждого теста — шаги «Тест: …» этого задания."
            echo "Все замечания одним файлом: [findings.csv в артефакте report-${{ matrix.site.key }}](${ARTIFACT_URL})."
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────── этап 3: сборщик логов ─────────────────────────────
  logs:
    needs: [infra, tests]
    if: always() && needs.infra.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # история в ветку metrics
      checks: write       # результаты тестов во вкладку Checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Спрятать адреса сайтов в логах
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          SITES: ${{ secrets.SITES }}
        run: python checks/core/list_sites.py --mask

      - name: Забрать результаты всех чанков
        uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: collected

      - name: Логи и отчёты одним архивом
        uses: actions/upload-artifact@v4
        with:
          name: logs-all
          path: |
            collected/**
            !collected/**/crawl.json
          retention-days: 90

      - name: Общая сводка
        run: python checks/core/build_index.py collected >> "$GITHUB_STEP_SUMMARY"

      - name: Результаты как тесты (вкладка Checks)
        if: hashFiles('collected/**/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: collected/**/junit.xml
          check_name: Общие проверки сайтов
          include_passed: true
          detailed_summary: true

      - name: История в ветку metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin metrics >/dev/null; then
            git fetch --depth=1 origin metrics && git worktree add m origin/metrics && git -C m checkout -B metrics
          else
            git worktree add --orphan -b metrics m
          fi
          mkdir -p m/history
          for s in collected/report-*/summary.json; do
            [ -f "$s" ] || continue
            f="m/history/$(jq -r .project_key "$s").csv"
            [ -f "$f" ] || echo "date,run,pages,pages_failed,urls,errors,warnings,info,failed,$(jq -r '.by_rule|keys_unsorted|join(",")' "$s")" > "$f"
            jq -r --arg run "$GITHUB_RUN_ID" \
              '[.started_at, $run, .pages, .pages_failed, (.urls_checked//0),
                (.findings_unique.error//0), (.findings_unique.warning//0), (.findings_unique.info//0), .failed]
                + [.by_rule[]] | @csv' \
              "$s" >> "$f"
          done
          cd m && git add history && git commit -qm "metrics: run $GITHUB_RUN_ID" && git push -q origin metrics || echo "нечего записывать"
