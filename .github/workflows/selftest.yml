# Проверка кода тестов на каждый PR и мерж в main: правила, разбор SITE_*, отчёты.
# Сайты здесь не обходятся — это делает common-checks.yml по расписанию и вручную.
name: Self-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Самопроверка правил и отчётов
        run: python -m unittest discover -v tests
