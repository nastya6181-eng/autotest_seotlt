name: Лазун
url: https://lazun.com/
max_pages: 300
delay: 0.5
# Битрикс «Контроль активности»: от ~2,5 запроса/с отвечает 503 «You have made too many
# requests per second» и банит IP примерно на 5 минут (замер 09.11.2026). 1,2 запроса/с проходит.
max_rps: 0.8
cooldown: 330
exclude: null
# robots.txt закрывает сайт от ботов; обход согласован с владельцем (задание заказчика)
ignore_robots: true
fail_on: [error, warning]
checks:
  spelling:
    ignore_file: ignore.txt
  typography: {}
  links:
    external: true
    workers: 2            # общий темп к сайту всё равно держит max_rps
severity: {}
