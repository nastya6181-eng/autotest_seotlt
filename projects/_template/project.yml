# Необязательные настройки сайта. Скопируй папку в projects/<ключ>, где ключ — тот же,
# что в строке секрета SITES. Адрес сайта здесь не указывается: он хранится только в секрете.
# Простые настройки (max_rps, ignore_robots, …) удобнее писать опциями прямо в строке SITES;
# папка нужна для объёмного: исключения орфографии, уровни правил, параметры проверок.
# Помни: репозиторий публичный — названия клиентов и адреса сюда не пишем.

max_pages: 200          # сколько страниц обходить
delay: 0.3              # пауза между страницами, с
exclude: null           # регэксп адресов, которые не обходить, напр. 'calendar/\?date='
ignore_robots: false    # true — только для своих сайтов или по заданию владельца
max_rps: null           # не чаще N запросов/с к сайту; ставь, если сайт отвечает 429/503 на частые запросы
cooldown: 60            # пауза, с, когда сайт всё же ответил «слишком много запросов»

# Уровни, при которых тест красный. Уровень — приоритет исправления, а не повод молчать:
# error — критично, warning — дефект, info — рекомендация (на статус не влияет)
fail_on: [error, warning]

checks:
  spelling:
    ignore_file: ignore.txt   # слова-исключения проекта
    suggest: true             # подсказки исправлений (медленнее)
  typography: {}
  links:
    external: true            # проверять ссылки на другие сайты
    workers: 3                # параллельных запросов; при 503 от сайта ставь 1–2
    ignore: null              # регэксп адресов, которые не проверять на доступность — только
                              # для проверенных ложных срабатываний (антибот внешнего сайта),
                              # с комментарием, почему

# Переопределить уровень правила для проекта: error | warning | info | off
severity:
  links.redirect: info
