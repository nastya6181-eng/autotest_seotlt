# Бэк: что проверять запросами к серверу. Формат — backend/README.md.
# Адрес сайта — из секрета SITE_<КЛЮЧ>. Слой пока в разработке: файл — описание.

ttfb_ms: 800                      # порог времени ответа по умолчанию

pages:                            # ожидаемые коды ответа
  - { path: /, status: 200 }
  - { path: /contacts, status: 301, location: /contacts/ }   # единый формат адреса — со слэшем
  - { path: /no-such-page-404/, status: 404 }

ajax: []                          # адреса, которые дёргает фронт: path, метод, ожидаемый формат
  # - { path: /local/ajax/calendar.php?month=2026-11, format: json, keys: [events] }

content: []                       # полнота данных в карточках
  # - { section: /news/, item_must_have: [дата] }

forms: []                         # отправка форм — только на тестовом стенде или с тестовой пометкой
  # - { name: feedback, staging_only: true }

security: false                   # базовые проверки безопасности — true только с разрешения владельца
